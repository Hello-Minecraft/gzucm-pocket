# Robolectric 全局配置
#
# graphicsMode=NATIVE 是必须的，不能省：
# Compose 对 `Outline.Generic`（自定义 Shape，比如 G3CornerShape）的命中检测
# 走 Path.op(Intersect)，LEGACY 图形模式下的 ShadowPath 不支持这个操作，
# 结果就是「clip(G3CornerShape) 之后点不动」——看起来像产品 bug，其实只是
# 测试环境缺图形后端。真机（NATIVE 绘制）一直是好的。
#
# 2026-11-18 全量换 G3 圆角时踩的：ExportContentTest / FloatingBarAutoHideTest /
# UiSmokeTest 同时报「点击没回调」，排查了两轮才定位到这里。
graphicsMode=NATIVE
